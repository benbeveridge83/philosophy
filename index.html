    .selected-box{border:1px dashed var(--border);border-radius:11px;padding:10px;background:#fafbfe;margin-bottom:9px}.small{font-size:.82rem;color:var(--muted)}
    .category-tree{display:flex;flex-direction:column;gap:8px}.cat{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}.cat-head{display:flex;align-items:center;gap:7px;padding:9px}.cat-toggle{width:31px;padding:5px}.cat-name{font-weight:700;flex:1}.cat-count{font-size:.78rem;color:var(--muted)}.cat-actions{display:flex;gap:5px}.cat-actions button{padding:5px 8px}.cat-body{padding:0 10px 10px 42px}.cat.collapsed>.cat-body{display:none}.word-bank{min-height:38px;border:1px dashed var(--border);border-radius:9px;padding:7px;display:flex;gap:6px;flex-wrap:wrap}.bank-word{padding:5px 8px;border:1px solid var(--border);border-radius:999px;background:#f8fafc;cursor:grab}.subtree{margin-top:8px;display:flex;flex-direction:column;gap:7px}.drop-target{outline:3px solid #b7c5ff}
    .class-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px}.class-sidebar{padding:12px}.class-item{padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;cursor:pointer}.class-item.active{background:var(--soft);border-color:#aebdff}.class-main{min-width:0}
    .modal{position:fixed;inset:0;background:rgba(12,18,32,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modal-card{width:min(520px,100%);padding:16px}.modal-card h3{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

    .mindmap-shell{border:1px solid var(--border);border-radius:14px;background:#fbfcff;padding:12px;overflow:auto;min-height:420px}.mindmap-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.mindmap-controls label{display:flex;gap:6px;align-items:center;font-size:.84rem;color:var(--muted)}.mindmap-controls input[type=checkbox]{width:auto}.mindmap{position:relative;display:flex;align-items:flex-start;gap:44px;padding:24px;min-width:max-content}.mind-col{display:flex;flex-direction:column;gap:18px;position:relative}.mind-node{position:relative;min-width:150px;max-width:240px;padding:9px 12px;border:2px solid var(--border);border-radius:12px;background:white;box-shadow:0 3px 10px rgba(20,30,55,.06);cursor:pointer}.mind-node strong{display:block}.mind-node .small{margin-top:3px}.mind-node::after{content:'';position:absolute;top:50%;right:-44px;width:44px;border-top:2px solid #c4ccda}.mind-col:last-child .mind-node::after{display:none}.mind-node.hidden-branch{opacity:.45}.map-list-item{padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;cursor:pointer}.map-list-item.active{background:var(--soft);border-color:#aebdff}.mindmap-editor-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}.branch-group{border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;background:white}.branch-head{display:flex;gap:8px;align-items:center}.branch-head input{flex:1}.branch-children{margin-top:8px;padding-left:20px;border-left:2px solid #d7deea}.branch-child{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:6px}@media(max-width:900px){.grid,.class-layout{grid-template-columns:1fr}.class-sidebar{order:0}.app{padding:8px}.cat-body{padding-left:12px}.mindmap-editor-row{grid-template-columns:1fr}.mindmap{gap:28px}.mind-node::after{right:-28px;width:28px}}

    .quick-cat-overlay{position:fixed;inset:0;background:rgba(12,18,32,.42);display:none;align-items:flex-end;justify-content:center;z-index:250;padding:12px}.quick-cat-overlay.open{display:flex}.quick-cat-sheet{width:min(560px,100%);max-height:min(78vh,720px);background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:0 18px 50px rgba(20,30,55,.25);overflow:hidden;display:flex;flex-direction:column}.quick-cat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}.quick-cat-title{flex:1;font-size:1.1rem;font-weight:700}.quick-cat-close{width:40px;height:40px;padding:0;border-radius:50%;font-size:1.25rem}.quick-cat-list{overflow:auto;padding:8px}.quick-cat-option{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:13px 12px;border:0;border-bottom:1px solid #eef1f6;border-radius:0;background:#fff}.quick-cat-option:last-child{border-bottom:0}.quick-cat-option:hover,.quick-cat-option:active{background:#f5f7ff}.quick-cat-dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}.quick-cat-path{flex:1}.quick-cat-current{font-size:.75rem;color:var(--muted)}.quick-cat-clear{color:var(--danger)}@media(min-width:700px){.quick-cat-overlay{align-items:center}.quick-cat-sheet{border-radius:16px;max-height:70vh}}

<body>
<div class="app">
  <header class="card">
    <div class="title-line"><div><h1>Word Characterization Studio</h1><div class="sub">Paste, type, photograph, upload, or speak text; then organize words into repeatable nested categories.</div></div><div id="syncLabel" class="small">Not signed in</div></div>
    <div class="tabs" id="mainTabs"><button class="tab active" data-page="characterizePage">Characterizing</button><button class="tab" data-page="categoriesPage">Categories</button><button class="tab" data-page="studyingPage">Studying</button><button class="tab" data-page="mindMapsPage">Mind Maps</button></div>
    <div id="notice" class="notice"></div>
  </header>

  <section class="card auth" id="authPanel">
    <div id="signedOut" class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signIn" class="primary">Sign in</button><button id="signUp">Create account</button></div>
    <div id="signedIn" class="row" style="display:none"><div>Signed in as <strong id="userEmail"></strong></div><button id="signOut">Sign out</button></div>
    <div id="authStatus" class="status"></div>
  </section>

  <main id="appMain" style="display:none">
    <section id="characterizePage" class="page active"></section>
    <section id="categoriesPage" class="page"></section>
    <section id="studyingPage" class="page"></section>
    <section id="mindMapsPage" class="page"></section>
  </main>
</div>

<div id="categoryModal" class="modal"><div class="card modal-card"><h3 id="catModalTitle">New category</h3><input id="catName" placeholder="Category name"><textarea id="catDesc" placeholder="Description (optional)" style="min-height:75px;margin-top:8px"></textarea><input id="catColor" type="color" value="#93c5fd" style="margin-top:8px;height:44px"><div class="modal-actions"><button id="catCancel">Cancel</button><button id="catSave" class="primary">Save</button></div></div></div>
<div id="classModal" class="modal"><div class="card modal-card"><h3>New study class</h3><input id="className" placeholder="Example: Organic Chemistry"><div class="modal-actions"><button id="classCancel">Cancel</button><button id="classSave" class="primary">Create class</button></div></div></div>
<div id="mapModal" class="modal"><div class="card modal-card"><h3>New mind map</h3><input id="mapName" placeholder="Mind map name"><div class="modal-actions"><button id="mapCancel">Cancel</button><button id="mapSave" class="primary">Create</button></div></div></div>


<div id="quickCategoryOverlay" class="quick-cat-overlay" aria-hidden="true"><div class="quick-cat-sheet" role="dialog" aria-modal="true" aria-labelledby="quickCategoryTitle"><div class="quick-cat-head"><div><div id="quickCategoryTitle" class="quick-cat-title">Choose a category</div><div id="quickCategoryWord" class="small"></div></div><button id="quickCategoryClose" class="quick-cat-close" aria-label="Close">×</button></div><div id="quickCategoryList" class="quick-cat-list"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const SUPABASE_URL="https://hopaazyvwuafjiyysiyh.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_xGht9QD1oIqPEqjtEasTpA_Z_x8apip";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
const palette=['#93c5fd','#86efac','#fca5a5','#fcd34d','#c4b5fd','#67e8f9','#fdba74','#f9a8d4'];
let currentUser=null, saveTimer=null, selected=null, currentPage='characterizePage', activeClassId=null, modalContext=null, recognition=null, activeMapId=null, quickCategoryContext=null;

function newWorkspace(name='Characterizing'){return{id:uid(),name,documents:[],activeDocumentId:null,categories:[{id:uid(),name:'Noun',desc:'A person, place, thing, or idea.',color:'#93c5fd',parentId:null,collapsed:false}],labels:{},dictionary:{},mindMaps:[],activeMapId:null,mapLevelVisibility:{}}}
function defaultState(){return{version:3,main:newWorkspace('Characterizing'),classes:[],activeClassId:null}}
let state=defaultState();

function migrate(categories,labels){
  const s=defaultState();
  if(Array.isArray(categories)&&categories.length)s.main.categories=categories.map(c=>({...c,parentId:c.parentId||null,collapsed:false}));
  const legacy={}; Object.entries(labels||{}).forEach(([k,v])=>{if(k!=='__app')legacy[k]=v});
  if(labels&&labels.__app){const x=labels.__app;normalizeState(x);return x;}
  if(Object.keys(legacy).length)s.main.legacyLabels=legacy;
  normalizeState(s);return s;
}
function normalizeWorkspace(ws){if(!ws)return;ws.mindMaps=Array.isArray(ws.mindMaps)?ws.mindMaps:[];ws.activeMapId=ws.activeMapId||ws.mindMaps[0]?.id||null;ws.mapLevelVisibility=ws.mapLevelVisibility||{};ws.mindMaps.forEach(m=>{m.branches=Array.isArray(m.branches)?m.branches:[];m.levelVisibility=m.levelVisibility||{1:true,2:true,3:true};m.collapsedBranches=m.collapsedBranches||{}})}
function normalizeState(st){normalizeWorkspace(st.main);(st.classes||[]).forEach(normalizeWorkspace)}
function packedLabels(){return{__app:state}}
function workspace(){if(currentPage==='studyingPage'){return state.classes.find(c=>c.id===activeClassId)||null}return state.main}
function wordsOnly(text){return(text.match(/[\p{L}\p{N}]+(?:['’-][\p{L}\p{N}]+)*/gu)||[])}
function tokenize(text){return text.match(/[\p{L}\p{N}]+(?:['’-][\p{L}\p{N}]+)*|[^\s\p{L}\p{N}]+/gu)||[]}
function splitSentences(text){const clean=text.replace(/\s+/g,' ').trim();if(!clean)return[];try{return Array.from(new Intl.Segmenter('en',{granularity:'sentence'}).segment(clean),x=>x.segment.trim()).filter(Boolean)}catch{return clean.match(/[^.!?]+(?:[.!?]+|$)/g)?.map(x=>x.trim()).filter(Boolean)||[clean]}}
function norm(w){return w.toLocaleLowerCase()}
function showNotice(msg,bad=false){const n=$('notice');n.textContent=msg;n.className='notice'+(bad?' warning':'');n.style.display='block';clearTimeout(showNotice.t);showNotice.t=setTimeout(()=>n.style.display='none',3000)}

async function loadState(){
 const {data,error}=await sb.from('word_category_state').select('categories,labels,story_index').eq('user_id',currentUser.id).maybeSingle();
 if(error){showNotice('Could not load: '+error.message,true);return}
 state=data?migrate(data.categories,data.labels):defaultState(); normalizeState(state); activeClassId=state.activeClassId||state.classes[0]?.id||null; activeMapId=(state.classes.find(c=>c.id===activeClassId)||state.main)?.activeMapId||null; renderAll(); if(!data)saveNow();
}
function scheduleSave(){clearTimeout(saveTimer);$('syncLabel').textContent='Saving...';saveTimer=setTimeout(saveNow,350)}
async function saveNow(){if(!currentUser)return;state.activeClassId=activeClassId;const payload={user_id:currentUser.id,categories:state.main.categories,labels:packedLabels(),story_index:0,updated_at:new Date().toISOString()};const {error}=await sb.from('word_category_state').upsert(payload,{onConflict:'user_id'});$('syncLabel').textContent=error?'Save failed':'Saved';if(error)showNotice(error.message,true)}

function activeDoc(ws){return ws?.documents.find(d=>d.id===ws.activeDocumentId)||null}
function labelKey(docId,sentIdx,tokIdx){return`${docId}|${sentIdx}|${tokIdx}`}
function categoryById(ws,id){return ws.categories.find(c=>c.id===id)}
function categoryPath(ws,id){const parts=[];let c=categoryById(ws,id),guard=0;while(c&&guard++<20){parts.unshift(c.name);c=categoryById(ws,c.parentId)}return parts.join(' › ')}
function addDocument(ws,text,title){const sentences=splitSentences(text);if(!sentences.length)return showNotice('No text was found.',true);const d={id:uid(),title:title||`Text ${ws.documents.length+1}`,originalText:text,sentences,createdAt:new Date().toISOString()};ws.documents.unshift(d);ws.activeDocumentId=d.id;selected=null;scheduleSave();renderAll();showNotice(`${sentences.length} sentence${sentences.length===1?'':'s'} added.`)}

function renderWorkspace(container,ws,prefix){
 if(!ws){container.innerHTML='<div class="card panel empty">Create or choose a study class.</div>';return}
 container.innerHTML=`<div class="grid"><div><div class="card panel intake"><h2>Add Text</h2><div class="input-tabs"><button class="input-tab active" data-mode="paste">Type / Paste</button><button class="input-tab" data-mode="file">Upload file or photo</button><button class="input-tab" data-mode="speech">Speak</button></div>
 <div class="input-pane active" data-pane="paste"><textarea id="${prefix}Text" placeholder="Type or paste a large amount of text here. It will be split into sentences automatically."></textarea><div class="toolbar"><input id="${prefix}Title" placeholder="Optional title" style="min-width:220px"><button class="primary" data-action="addText">Break into sentences</button></div></div>
 <div class="input-pane" data-pane="file"><input id="${prefix}File" type="file" accept=".txt,.md,.csv,image/*"><div class="small" style="margin-top:7px">Text files are read directly. Photos are converted to text with OCR in your browser.</div><div class="toolbar"><button class="primary" data-action="processFile">Read upload</button></div></div>
 <div class="input-pane" data-pane="speech"><textarea id="${prefix}Speech" placeholder="Your speech will appear here."></textarea><div class="toolbar"><button class="primary" data-action="startSpeech">Start speaking</button><button data-action="stopSpeech">Stop</button><button data-action="addSpeech">Add as text</button></div></div></div>
 <div class="card panel"><div class="docbar"><select data-role="docSelect"></select><button data-action="renameDoc">Rename</button><button class="danger" data-action="deleteDoc">Delete</button></div><div class="toolbar"><button class="soft" data-action="applyDictionary">Apply remembered words</button><button data-action="showUnlabeled">Show unlabeled only</button><button data-action="showAll">Show all</button></div><div data-role="sentences"></div></div></div>
 <aside class="card panel"><h2>Selected Word</h2><div data-role="selectedBox" class="selected-box small">Click a word to characterize it.</div><label class="small">Assign category or subcategory</label><select data-role="categorySelect"></select><div class="toolbar"><button class="primary" data-action="assign">Assign and remember</button><button data-action="clear">Clear</button></div><div class="small">“Assign and remember” teaches the app that this spelling should receive the same category later. Use “Apply remembered words” after adding new text.</div><h3>Categories</h3><button data-action="newRoot">+ New top-level category</button><div data-role="miniCategories" style="margin-top:9px"></div></aside></div>`;
 bindWorkspace(container,ws,prefix);renderWorkspaceParts(container,ws);
}
function bindWorkspace(container,ws,prefix){
 container.querySelectorAll('.input-tab').forEach(b=>b.onclick=()=>{container.querySelectorAll('.input-tab').forEach(x=>x.classList.toggle('active',x===b));container.querySelectorAll('.input-pane').forEach(x=>x.classList.toggle('active',x.dataset.pane===b.dataset.mode))});
 container.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b.dataset.action,container,ws,prefix));
 container.querySelector('[data-role="docSelect"]').onchange=e=>{ws.activeDocumentId=e.target.value;selected=null;scheduleSave();renderWorkspaceParts(container,ws)};
}
async function handleAction(a,c,ws,p){
 if(a==='addText'){addDocument(ws,$(p+'Text').value,$(p+'Title').value.trim());$(p+'Text').value='';$(p+'Title').value=''}
 if(a==='processFile'){const f=$(p+'File').files[0];if(!f)return showNotice('Choose a file or photo.',true);let text='';if(f.type.startsWith('image/')){showNotice('Reading text from photo...');try{const r=await Tesseract.recognize(f,'eng');text=r.data.text}catch(e){return showNotice('Photo text recognition failed: '+e.message,true)}}else{text=await f.text()}addDocument(ws,text,f.name)}
 if(a==='startSpeech')startSpeech($(p+'Speech')); if(a==='stopSpeech'&&recognition)recognition.stop(); if(a==='addSpeech')addDocument(ws,$(p+'Speech').value,'Spoken text');
 if(a==='applyDictionary')applyDictionary(ws); if(a==='showUnlabeled'){ws.showUnlabeled=true;renderWorkspaceParts(c,ws)} if(a==='showAll'){ws.showUnlabeled=false;renderWorkspaceParts(c,ws)}
 if(a==='assign')assignSelected(ws,c); if(a==='clear')clearSelected(ws,c); if(a==='newRoot')openCategoryModal(ws,null,null); if(a==='renameDoc')renameDoc(ws,c); if(a==='deleteDoc')deleteDoc(ws,c);
}
function startSpeech(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return showNotice('Speech recognition is not supported in this browser. Chrome or Edge works best.',true);recognition=new SR();recognition.continuous=true;recognition.interimResults=true;let final=target.value;recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=(final?' ':'')+t;else interim+=t}target.value=final+(interim?' '+interim:'')};recognition.onerror=e=>showNotice('Microphone error: '+e.error,true);recognition.start();showNotice('Listening...')}
function renderWorkspaceParts(c,ws){
 const ds=c.querySelector('[data-role="docSelect"]');ds.innerHTML=ws.documents.length?ws.documents.map(d=>`<option value="${d.id}" ${d.id===ws.activeDocumentId?'selected':''}>${esc(d.title)}</option>`).join(''):'<option value="">No texts yet</option>';
 const cs=c.querySelector('[data-role="categorySelect"]');cs.innerHTML='<option value="">Choose a category</option>'+flattenCategories(ws).map(x=>`<option value="${x.cat.id}">${'— '.repeat(x.depth)}${esc(x.cat.name)}</option>`).join('');
 const box=c.querySelector('[data-role="selectedBox"]');if(selected&&selected.wsId===ws.id){const cat=categoryById(ws,ws.labels[selected.key]);box.innerHTML=`<strong>${esc(selected.word)}</strong><br><span class="small">${cat?'Current: '+esc(categoryPath(ws,cat.id)):'Not characterized'}</span>`;cs.value=cat?.id||''}else box.textContent='Click a word to characterize it.';
 renderSentences(c.querySelector('[data-role="sentences"]'),ws);renderMiniCategories(c.querySelector('[data-role="miniCategories"]'),ws);
}
function renderSentences(el,ws){const d=activeDoc(ws);if(!d){el.innerHTML='<div class="empty">Add text above to begin.</div>';return}el.innerHTML='';d.sentences.forEach((s,si)=>{const div=document.createElement('div');div.className='sentence';div.innerHTML=`<div class="sentence-num">Sentence ${si+1}</div>`;tokenize(s).forEach((t,ti)=>{const isWord=/[\p{L}\p{N}]/u.test(t);const span=document.createElement('span');span.textContent=t;if(!isWord){span.className='punct';div.appendChild(span);return}const key=labelKey(d.id,si,ti),cid=ws.labels[key],cat=categoryById(ws,cid);if(ws.showUnlabeled&&cid)return;span.className='word'+(cid?'':' unlabeled')+(selected?.key===key&&selected.wsId===ws.id?' selected':'');if(cat){span.style.background=cat.color;span.style.borderColor=cat.color;span.title=categoryPath(ws,cat.id)}span.onclick=e=>{e.stopPropagation();selected={wsId:ws.id,key,word:t};openQuickCategoryMenu(ws,key,t)};div.appendChild(span)});el.appendChild(div)})}
function flattenCategories(ws,parentId=null,depth=0,out=[]){ws.categories.filter(c=>(c.parentId||null)===parentId).forEach(cat=>{out.push({cat,depth});flattenCategories(ws,cat.id,depth+1,out)});return out}
function renderMiniCategories(el,ws){el.innerHTML=flattenCategories(ws).map(x=>`<div style="margin-left:${x.depth*15}px;padding:5px 0"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${x.cat.color};margin-right:6px"></span>${esc(x.cat.name)}</div>`).join('')||'<div class="small">No categories yet.</div>'}

function openQuickCategoryMenu(ws,key,word){quickCategoryContext={ws,key,word};const overlay=$('quickCategoryOverlay'),list=$('quickCategoryList');$('quickCategoryWord').textContent=`“${word}”`;list.innerHTML='';const current=ws.labels[key];flattenCategories(ws).forEach(({cat,depth})=>{const b=document.createElement('button');b.className='quick-cat-option';b.innerHTML=`<span class="quick-cat-dot" style="background:${cat.color}"></span><span class="quick-cat-path">${esc(categoryPath(ws,cat.id))}</span>${current===cat.id?'<span class="quick-cat-current">Current</span>':''}`;b.onclick=()=>{ws.labels[key]=cat.id;ws.dictionary[norm(word)]=cat.id;closeQuickCategoryMenu();scheduleSave();renderAll();showNotice(`${word} assigned to ${categoryPath(ws,cat.id)}.`)};list.appendChild(b)});if(current){const clear=document.createElement('button');clear.className='quick-cat-option quick-cat-clear';clear.textContent='Clear characterization';clear.onclick=()=>{delete ws.labels[key];closeQuickCategoryMenu();scheduleSave();renderAll()};list.appendChild(clear)}overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}
function closeQuickCategoryMenu(){quickCategoryContext=null;$('quickCategoryOverlay').classList.remove('open');$('quickCategoryOverlay').setAttribute('aria-hidden','true')}
$('quickCategoryClose').onclick=closeQuickCategoryMenu;$('quickCategoryOverlay').onclick=e=>{if(e.target===$('quickCategoryOverlay'))closeQuickCategoryMenu()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQuickCategoryMenu()});
function assignSelected(ws,c){if(!selected||selected.wsId!==ws.id)return showNotice('Select a word first.',true);const cid=c.querySelector('[data-role="categorySelect"]').value;if(!cid)return showNotice('Choose a category.',true);ws.labels[selected.key]=cid;ws.dictionary[norm(selected.word)]=cid;scheduleSave();renderAll()}
function clearSelected(ws,c){if(!selected||selected.wsId!==ws.id)return;delete ws.labels[selected.key];scheduleSave();renderAll()}
function applyDictionary(ws){let n=0;ws.documents.forEach(d=>d.sentences.forEach((s,si)=>tokenize(s).forEach((t,ti)=>{if(!/[\p{L}\p{N}]/u.test(t))return;const key=labelKey(d.id,si,ti),cid=ws.dictionary[norm(t)];if(cid&&categoryById(ws,cid)&&!ws.labels[key]){ws.labels[key]=cid;n++}})));scheduleSave();renderAll();showNotice(`${n} word occurrence${n===1?'':'s'} characterized from memory.`)}
function renameDoc(ws,c){const d=activeDoc(ws);if(!d)return;const v=prompt('Document title:',d.title);if(v?.trim()){d.title=v.trim();scheduleSave();renderAll()}}
function deleteDoc(ws,c){const d=activeDoc(ws);if(!d||!confirm(`Delete “${d.title}”?`))return;ws.documents=ws.documents.filter(x=>x.id!==d.id);Object.keys(ws.labels).forEach(k=>{if(k.startsWith(d.id+'|'))delete ws.labels[k]});ws.activeDocumentId=ws.documents[0]?.id||null;selected=null;scheduleSave();renderAll()}

function renderCategoryPage(){const ws=state.main, el=$('categoriesPage');el.innerHTML=`<div class="card panel"><div class="title-line"><div><h2>Category Library</h2><div class="small">Drag words into another category or subcategory. Every heading can collapse.</div></div><button id="newTopCategory" class="primary">+ New category</button></div><div id="fullTree" class="category-tree" style="margin-top:12px"></div></div>`;$('newTopCategory').onclick=()=>openCategoryModal(ws,null,null);renderTree($('fullTree'),ws,null)}
function renderTree(el,ws,parentId){el.innerHTML='';ws.categories.filter(c=>(c.parentId||null)===parentId).forEach(cat=>{const node=document.createElement('div');node.className='cat'+(cat.collapsed?' collapsed':'');node.dataset.catId=cat.id;const unique=uniqueWordsForCategory(ws,cat.id);node.innerHTML=`<div class="cat-head"><button class="cat-toggle">${cat.collapsed?'▸':'▾'}</button><span style="width:13px;height:13px;border-radius:50%;background:${cat.color}"></span><div class="cat-name">${esc(cat.name)}</div><div class="cat-count">${unique.length} word${unique.length===1?'':'s'}</div><div class="cat-actions"><button data-add>+ Subcategory</button><button data-edit>Edit</button><button data-del class="danger">Delete</button></div></div><div class="cat-body"><div class="small" style="margin-bottom:6px">${esc(cat.desc||'No description')}</div><div class="word-bank"></div><div class="subtree"></div></div>`;
 const bank=node.querySelector('.word-bank');unique.forEach(w=>{const chip=document.createElement('span');chip.className='bank-word';chip.textContent=w;chip.draggable=true;chip.onclick=()=>characterizeDictionaryWord(ws,w);chip.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({word:w,from:cat.id}));bank.appendChild(chip)});bank.ondragover=e=>{e.preventDefault();bank.classList.add('drop-target')};bank.ondragleave=()=>bank.classList.remove('drop-target');bank.ondrop=e=>{e.preventDefault();bank.classList.remove('drop-target');try{const x=JSON.parse(e.dataTransfer.getData('text/plain'));moveDictionaryWord(ws,x.word,cat.id)}catch{}};
 node.querySelector('.cat-toggle').onclick=()=>{cat.collapsed=!cat.collapsed;scheduleSave();renderAll()};node.querySelector('[data-add]').onclick=()=>openCategoryModal(ws,cat.id,null);node.querySelector('[data-edit]').onclick=()=>openCategoryModal(ws,cat.parentId,cat);node.querySelector('[data-del]').onclick=()=>deleteCategory(ws,cat.id);renderTree(node.querySelector('.subtree'),ws,cat.id);el.appendChild(node)})}
function uniqueWordsForCategory(ws,cid){return Object.entries(ws.dictionary).filter(([,v])=>v===cid).map(([w])=>w).sort()}
function moveDictionaryWord(ws,word,cid){ws.dictionary[norm(word)]=cid;Object.keys(ws.labels).forEach(k=>{const d=ws.documents.find(d=>k.startsWith(d.id+'|'));if(!d)return;const [,si,ti]=k.split('|');const token=tokenize(d.sentences[+si])[+ti];if(token&&norm(token)===norm(word))ws.labels[k]=cid});scheduleSave();renderAll()}
function characterizeDictionaryWord(ws,word){const options=flattenCategories(ws).map(x=>`${x.cat.id}::${'—'.repeat(x.depth)}${x.cat.name}`).join('\n');const name=prompt(`Type the exact category name for “${word}”:\n\n${flattenCategories(ws).map(x=>'  '.repeat(x.depth)+x.cat.name).join('\n')}`);if(!name)return;const cat=ws.categories.find(c=>c.name.toLowerCase()===name.trim().toLowerCase());if(!cat)return showNotice('Category name not found.',true);moveDictionaryWord(ws,word,cat.id)}
function openCategoryModal(ws,parentId,cat){modalContext={ws,parentId,cat};$('catModalTitle').textContent=cat?'Edit category':parentId?'New subcategory':'New category';$('catName').value=cat?.name||'';$('catDesc').value=cat?.desc||'';$('catColor').value=cat?.color||palette[ws.categories.length%palette.length];$('categoryModal').classList.add('open')}
function deleteCategory(ws,id){const cat=categoryById(ws,id);if(!cat||!confirm(`Delete “${cat.name}” and its subcategories? Words in them will become uncharacterized.`))return;const ids=new Set([id]);let changed=true;while(changed){changed=false;ws.categories.forEach(c=>{if(c.parentId&&ids.has(c.parentId)&&!ids.has(c.id)){ids.add(c.id);changed=true}})}ws.categories=ws.categories.filter(c=>!ids.has(c.id));Object.keys(ws.labels).forEach(k=>{if(ids.has(ws.labels[k]))delete ws.labels[k]});Object.keys(ws.dictionary).forEach(k=>{if(ids.has(ws.dictionary[k]))delete ws.dictionary[k]});scheduleSave();renderAll()}

function renderStudying(){const el=$('studyingPage');if(!activeClassId&&state.classes[0])activeClassId=state.classes[0].id;el.innerHTML=`<div class="class-layout"><aside class="card class-sidebar"><div class="title-line"><h2 style="margin:0;font-size:1.05rem">Classes</h2><button id="addClass">+</button></div><div id="classList" style="margin-top:10px"></div></aside><div id="classWorkspace" class="class-main"></div></div>`;$('addClass').onclick=()=>{$('className').value='';$('classModal').classList.add('open')};const list=$('classList');state.classes.forEach(cl=>{const d=document.createElement('div');d.className='class-item'+(cl.id===activeClassId?' active':'');d.innerHTML=`<strong>${esc(cl.name)}</strong><div class="small">${cl.documents.length} text${cl.documents.length===1?'':'s'}</div>`;d.onclick=()=>{activeClassId=cl.id;scheduleSave();renderAll()};list.appendChild(d)});if(!state.classes.length)list.innerHTML='<div class="small">Create a class such as Organic Chemistry.</div>';renderWorkspace($('classWorkspace'),workspace(),'study')}

function categoryDepth(ws,cat){let d=1,c=cat,g=0;while(c?.parentId&&g++<20){d++;c=categoryById(ws,c.parentId)}return d}
function renderCategoryMindMap(ws,el){const maxDepth=Math.max(1,...ws.categories.map(c=>categoryDepth(ws,c)));if(!Object.keys(ws.mapLevelVisibility).length)for(let i=1;i<=maxDepth;i++)ws.mapLevelVisibility[i]=true;el.innerHTML=`<div class="card panel"><div class="title-line"><div><h2>Category Mind Map</h2><div class="small">This map is generated from your categories, subcategories, and characterized words.</div></div></div><div class="mindmap-controls" id="catMapControls"></div><div class="mindmap-shell"><div class="mindmap" id="catMindMap"></div></div></div>`;const ctl=el.querySelector('#catMapControls');for(let i=1;i<=maxDepth+1;i++){const lab=document.createElement('label');lab.innerHTML=`<input type="checkbox" ${ws.mapLevelVisibility[i]!==false?'checked':''}> ${i<=maxDepth?'Category level '+i:'Words'}`;lab.querySelector('input').onchange=e=>{ws.mapLevelVisibility[i]=e.target.checked;scheduleSave();renderMindMapsPage()};ctl.appendChild(lab)}const map=el.querySelector('#catMindMap');const cols=[];for(let d=1;d<=maxDepth;d++){if(ws.mapLevelVisibility[d]===false)continue;const col=document.createElement('div');col.className='mind-col';ws.categories.filter(c=>categoryDepth(ws,c)===d).forEach(cat=>{const n=document.createElement('div');n.className='mind-node';n.style.borderColor=cat.color;n.innerHTML=`<strong>${esc(cat.name)}</strong><div class="small">${uniqueWordsForCategory(ws,cat.id).length} words</div>`;col.appendChild(n)});cols.push(col)}if(ws.mapLevelVisibility[maxDepth+1]!==false){const col=document.createElement('div');col.className='mind-col';Object.entries(ws.dictionary).sort().forEach(([w,cid])=>{const cat=categoryById(ws,cid);if(!cat)return;const n=document.createElement('div');n.className='mind-node';n.style.borderColor=cat.color;n.innerHTML=`<strong>${esc(w)}</strong><div class="small">${esc(categoryPath(ws,cid))}</div>`;col.appendChild(n)});cols.push(col)}cols.forEach(c=>map.appendChild(c));if(!map.children.length)map.innerHTML='<div class="empty">Turn on at least one level.</div>'}
function renderMindMapsPage(){const el=$('mindMapsPage'),ws=activeClassId?state.classes.find(c=>c.id===activeClassId):state.main;el.innerHTML=`<div class="class-layout"><aside class="card class-sidebar"><div class="title-line"><h2 style="margin:0;font-size:1.05rem">Mind Maps</h2><button id="newMindMap">+</button></div><div class="small" style="margin:8px 0">${esc(ws?.name||'Characterizing')}</div><div id="mindMapList"></div></aside><div id="mindMapMain" class="class-main"></div></div>`;if(!ws){$('mindMapMain').innerHTML='<div class="card panel empty">Choose or create a class first.</div>';return}$('newMindMap').onclick=()=>{$('mapName').value='';$('mapModal').classList.add('open')};const list=$('mindMapList');ws.mindMaps.forEach(m=>{const d=document.createElement('div');d.className='map-list-item'+(m.id===ws.activeMapId?' active':'');d.innerHTML=`<strong>${esc(m.name)}</strong><div class="small">${m.branches.length} branches</div>`;d.onclick=()=>{ws.activeMapId=m.id;activeMapId=m.id;scheduleSave();renderMindMapsPage()};list.appendChild(d)});if(!ws.mindMaps.length)list.innerHTML='<div class="small">Create a standalone mind map for this class.</div>';const main=$('mindMapMain');const catWrap=document.createElement('div');renderCategoryMindMap(ws,catWrap);main.appendChild(catWrap);const map=ws.mindMaps.find(m=>m.id===ws.activeMapId);if(map){const area=document.createElement('div');area.className='card panel';area.style.marginTop='12px';area.innerHTML=`<div class="title-line"><div><h2>${esc(map.name)}</h2><div class="small">Standalone class mind map</div></div><div><button data-rename>Rename</button> <button data-delete class="danger">Delete</button></div></div><div class="mindmap-controls" data-levels></div><div class="toolbar"><button data-addbranch class="primary">+ Add branch</button></div><div data-editor></div><div class="mindmap-shell"><div class="mindmap" data-map></div></div>`;main.appendChild(area);renderStandaloneMap(ws,map,area)}}
function renderStandaloneMap(ws,map,area){const levels=area.querySelector('[data-levels]');[1,2,3].forEach(i=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" ${map.levelVisibility[i]!==false?'checked':''}> Level ${i}`;l.querySelector('input').onchange=e=>{map.levelVisibility[i]=e.target.checked;scheduleSave();renderMindMapsPage()};levels.appendChild(l)});area.querySelector('[data-addbranch]').onclick=()=>{map.branches.push({id:uid(),name:'New branch',children:[]});scheduleSave();renderMindMapsPage()};area.querySelector('[data-rename]').onclick=()=>{const v=prompt('Mind map name:',map.name);if(v?.trim()){map.name=v.trim();scheduleSave();renderMindMapsPage()}};area.querySelector('[data-delete]').onclick=()=>{if(confirm(`Delete “${map.name}”?`)){ws.mindMaps=ws.mindMaps.filter(x=>x.id!==map.id);ws.activeMapId=ws.mindMaps[0]?.id||null;scheduleSave();renderMindMapsPage()}};const ed=area.querySelector('[data-editor]');map.branches.forEach(br=>{const g=document.createElement('div');g.className='branch-group';g.innerHTML=`<div class="branch-head"><input value="${esc(br.name)}"><button data-collapse>${map.collapsedBranches[br.id]?'Expand':'Collapse'}</button><button data-del class="danger">Delete</button></div><div class="branch-children"></div><div class="toolbar"><button data-addchild>+ Add item</button></div>`;g.querySelector('input').onchange=e=>{br.name=e.target.value;scheduleSave();renderMindMapsPage()};g.querySelector('[data-collapse]').onclick=()=>{map.collapsedBranches[br.id]=!map.collapsedBranches[br.id];scheduleSave();renderMindMapsPage()};g.querySelector('[data-del]').onclick=()=>{map.branches=map.branches.filter(x=>x.id!==br.id);scheduleSave();renderMindMapsPage()};const kids=g.querySelector('.branch-children');if(map.collapsedBranches[br.id])kids.style.display='none';br.children.forEach(ch=>{const r=document.createElement('div');r.className='branch-child';r.innerHTML=`<input value="${esc(ch.name)}"><button class="danger">Delete</button>`;r.querySelector('input').onchange=e=>{ch.name=e.target.value;scheduleSave();renderMindMapsPage()};r.querySelector('button').onclick=()=>{br.children=br.children.filter(x=>x.id!==ch.id);scheduleSave();renderMindMapsPage()};kids.appendChild(r)});g.querySelector('[data-addchild]').onclick=()=>{br.children.push({id:uid(),name:'New item'});scheduleSave();renderMindMapsPage()};ed.appendChild(g)});const canvas=area.querySelector('[data-map]');if(map.levelVisibility[1]!==false){const c=document.createElement('div');c.className='mind-col';c.innerHTML=`<div class="mind-node"><strong>${esc(map.name)}</strong><div class="small">Mind map</div></div>`;canvas.appendChild(c)}if(map.levelVisibility[2]!==false){const c=document.createElement('div');c.className='mind-col';map.branches.forEach(br=>{const n=document.createElement('div');n.className='mind-node'+(map.collapsedBranches[br.id]?' hidden-branch':'');n.innerHTML=`<strong>${esc(br.name)}</strong><div class="small">${br.children.length} items</div>`;n.onclick=()=>{map.collapsedBranches[br.id]=!map.collapsedBranches[br.id];scheduleSave();renderMindMapsPage()};c.appendChild(n)});canvas.appendChild(c)}if(map.levelVisibility[3]!==false){const c=document.createElement('div');c.className='mind-col';map.branches.filter(br=>!map.collapsedBranches[br.id]).forEach(br=>br.children.forEach(ch=>{const n=document.createElement('div');n.className='mind-node';n.innerHTML=`<strong>${esc(ch.name)}</strong><div class="small">${esc(br.name)}</div>`;c.appendChild(n)}));canvas.appendChild(c)}if(!canvas.children.length)canvas.innerHTML='<div class="empty">Turn on at least one level.</div>'}

function renderAll(){renderWorkspace($('characterizePage'),state.main,'main');renderCategoryPage();renderStudying();renderMindMapsPage()}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

$('catCancel').onclick=()=>$('categoryModal').classList.remove('open');$('catSave').onclick=()=>{const {ws,parentId,cat}=modalContext||{};const name=$('catName').value.trim();if(!name)return showNotice('Enter a category name.',true);if(cat){cat.name=name;cat.desc=$('catDesc').value.trim();cat.color=$('catColor').value}else ws.categories.push({id:uid(),name,desc:$('catDesc').value.trim(),color:$('catColor').value,parentId:parentId||null,collapsed:false});$('categoryModal').classList.remove('open');scheduleSave();renderAll()};
$('classCancel').onclick=()=>$('classModal').classList.remove('open');$('classSave').onclick=()=>{const name=$('className').value.trim();if(!name)return;const cl=newWorkspace(name);state.classes.push(cl);activeClassId=cl.id;$('classModal').classList.remove('open');scheduleSave();renderAll()};
$('mapCancel').onclick=()=>$('mapModal').classList.remove('open');$('mapSave').onclick=()=>{const ws=activeClassId?state.classes.find(c=>c.id===activeClassId):state.main;const name=$('mapName').value.trim();if(!ws||!name)return;const m={id:uid(),name,branches:[],levelVisibility:{1:true,2:true,3:true},collapsedBranches:{}};ws.mindMaps.push(m);ws.activeMapId=m.id;activeMapId=m.id;$('mapModal').classList.remove('open');scheduleSave();renderAll()};
$('mainTabs').onclick=e=>{const b=e.target.closest('[data-page]');if(!b)return;currentPage=b.dataset.page;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===currentPage));selected=null;renderAll()};
$('signIn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('authStatus').textContent=error?error.message:'Signed in.'};
$('signUp').onclick=async()=>{const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authStatus').textContent=error?error.message:(data.session?'Account created.':'Account created. Check your email to confirm it.')};
$('signOut').onclick=()=>sb.auth.signOut();
async function setSession(session){currentUser=session?.user||null;$('signedOut').style.display=currentUser?'none':'flex';$('signedIn').style.display=currentUser?'flex':'none';$('appMain').style.display=currentUser?'block':'none';$('userEmail').textContent=currentUser?.email||'';$('syncLabel').textContent=currentUser?'Loading...':'Not signed in';if(currentUser)await loadState()}
sb.auth.onAuthStateChange((_e,s)=>setSession(s));
(async()=>{if(SUPABASE_PUBLISHABLE_KEY.includes('PASTE_'))showNotice('Paste your Supabase publishable key into the file before deploying.',true);const {data}=await sb.auth.getSession();await setSession(data.session)})();
</script>
